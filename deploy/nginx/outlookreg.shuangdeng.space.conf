# outlookreg.shuangdeng.space — Outlook 自动注册控制台反向代理
#
# 由 deploy/bootstrap-server.sh 部署到宿主机 /opt/1panel/www/conf.d/
# （该目录被 1Panel 的 openresty 容器挂载为 conf.d，改完 reload 生效）
#
# 后端：127.0.0.1:8890（由 deploy/docker-compose.prod.yml 提供）
#
# 注意：本站点按需求「不做任何认证」，所有 API 公网可见可调用。

server {
    listen 80;
    listen [::]:80;
    server_name outlookreg.shuangdeng.space;
    client_max_body_size 64m;
    underscores_in_headers on;

    # ACME HTTP-01 校验目录；certbot --webroot 也写这里
    location ^~ /.well-known/acme-challenge/ {
        root /www/sites/acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 308 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name outlookreg.shuangdeng.space;
    http2 on;
    client_max_body_size 64m;
    underscores_in_headers on;

    ssl_certificate /usr/local/openresty/nginx/conf/ssl/outlookreg.shuangdeng.space/fullchain.pem;
    ssl_certificate_key /usr/local/openresty/nginx/conf/ssl/outlookreg.shuangdeng.space/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # 注册/打码是长连接 + SSE 流式日志，关掉缓冲并放宽超时
    location / {
        proxy_pass http://127.0.0.1:8890;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        # 与本机其它 1Panel 站点保持一致：nginx.conf 里没有定义
        # $connection_upgrade 所需的 http 级 map，所以这里用固定值。
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}