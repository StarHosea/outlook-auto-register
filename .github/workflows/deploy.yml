name: Deploy to production

# 生产部署：master 一有推送就自动上线。
# 服务器上有一份仓库副本，流水线只做「SSH 过去执行 deploy/deploy.sh」，
# 由脚本负责 git reset --hard 到 origin/master + docker compose 重建。
on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      branch:
        description: "要部署的分支（默认 master）"
        required: false
        default: master

# 防止两次部署叠在一起：并发时排队而非取消（取消=中途换版本）
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & deploy to ${{ vars.DEPLOY_HOST || '140.238.56.209' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST || '140.238.56.209' }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER || 'muhaoxing' }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/outlook-auto-register' }}
      BRANCH: ${{ github.event.inputs.branch || 'master' }}
      SITE_URL: https://outlookreg.shuangdeng.space

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.ref }}
          fetch-depth: 0

      - name: Pin server host key
        # 只信任这一把服务器主机密钥。对不上就直接失败，避免
        # 中间人冒充服务器骗走部署私钥。
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          EXPECTED="HOSTKEY_PLACEHOLDER"
          keyscan_out=$(ssh-keyscan -t ed25519,rsa "$DEPLOY_HOST" 2>/dev/null)
          if [ -z "$keyscan_out" ]; then
            echo "::error::扫不到 $DEPLOY_HOST 的主机密钥，服务器不可达"
            exit 1
          fi
          echo "$keyscan_out" > ~/.ssh/known_hosts
          actual=$(ssh-keygen -lf ~/.ssh/known_hosts | awk '{print $2}' | sort)
          if [ "$actual" != "$EXPECTED" ]; then
            echo "::error::服务器主机密钥与固定值不符，可能被劫持或服务器重装过"
            echo "期望: $EXPECTED"
            echo "实际: $actual"
            exit 1
          fi
          echo "主机密钥校验通过: $actual"

      - name: Run deploy script on server
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${DEPLOY_SSH_KEY}" ]; then
            echo "::error::缺少 secret DEPLOY_SSH_KEY"
            exit 1
          fi
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh -i ~/.ssh/deploy_key \
              -o IdentitiesOnly=yes \
              -o BatchMode=yes \
              "$DEPLOY_USER@$DEPLOY_HOST" \
              "cd '$DEPLOY_PATH' && BRANCH='$BRANCH' APP_DIR='$DEPLOY_PATH' bash deploy/deploy.sh"
          rm -f ~/.ssh/deploy_key

      - name: Smoke test public endpoint
        run: |
          set -euo pipefail
          ok=0
          for i in $(seq 1 10); do
            if curl -fsS --max-time 10 "$SITE_URL/api/ping" | grep -q '"ok"'; then
              echo "公网可达且健康: $SITE_URL/api/ping"
              ok=1
              break
            fi
            echo "第 $i 次探测未通过，2s 后重试"
            sleep 2
          done
          if [ "$ok" != "1" ]; then
            echo "::error::部署完成但公网 /api/ping 不通，请检查 openresty 反代与证书"
            exit 1
          fi